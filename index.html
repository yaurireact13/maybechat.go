<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaybeChat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/sinfondo-maybe.png" type="image">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar con la lista de contactos -->
        <div class="sidebar">
            <!-- Encabezado de la barra lateral -->
            <div class="sidebar-header">
                <img src="img/sinfondo-maybe.png" alt="MaybeChat Icon" class="profile-pic" title="maybe_logo">
                <h1 id="page-title">MaybeChat</h1>
                <button id="add-contact-button"><i class="fas fa-user-plus"></i></button>
            </div>

            <p id="me-label" class="me-label"></p>

            <!-- Cuadro de búsqueda (Fijo) -->
            <div class="search-box">
                <input type="text" placeholder="Buscar en tus chats" autocomplete="off" id="search-input">
            </div>

            <!-- Botones de filtro de contactos (Fijo) -->
            <div class="filter-buttons">
                <button class="filter-button active">Todos</button>
                <button class="filter-button">No leídos</button>
                <button class="filter-button">Favoritos</button>
            </div>

            <!-- Contenedor de la lista de contactos con scroll -->
            <div class="chat-list" id="chat-list">
                <!-- Los contactos se generarán dinámicamente aquí con JavaScript -->
            </div>

        </div>

        <!-- Ventana de chat principal -->
        <div class="chat-window">
            <!-- Encabezado de la ventana de chat -->
            <div class="chat-header">
                <img src="img/contactundefined.jpg" alt="" class="contact-pic" id="chat-header-pic" hidden>
                <div class="contact-info">
                    <h2 id="chat-header-name">MaybeChat</h2>
                    <p id="chat-header-status">Selecciona un chat</p>
                </div>
                <div class="header-actions">
                    <button id="logout-button"><b>Cerrar Sesión</b></button>
                    <button id="clear-chat-button" title="Vaciar chat" hidden><i class="fas fa-trash-alt"></i></button>
                    <i class="fas fa-ellipsis-v" id="options-icon" style="display: none;"></i> <!-- Ocultamos el ícono anterior -->
                </div>
            </div>
            
            <!-- Cuerpo del chat donde se mostrarán los mensajes -->
            <div class="chat-body" id="chat-body">
                <!-- Los mensajes se cargarán dinámicamente aquí -->
            </div>

            <!-- Pie de la ventana de chat para enviar mensajes -->
            <div class="chat-footer">
                <input type="text" placeholder="Escribe un mensaje" id="message-input" maxlength="2000" autocomplete="off" disabled>
                <button id="send-button" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Spinner de carga -->
    <div id="loading-spinner" class="loading-spinner">
        <div class="spinner"></div>
    </div>

    <!-- Modal para iniciar un chat con otro usuario -->
    <div id="add-contact-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Nuevo chat</h2>
            <form id="add-contact-form" autocomplete="off">
                <label for="contact-name">Busca a un usuario registrado:</label>
                <input type="text" id="contact-name" placeholder="Escribe su nombre de usuario" maxlength="20" required>
                <p id="add-contact-error" class="form-error" role="alert"></p>
                <ul id="user-results" class="user-results"></ul>
                <button type="submit">Iniciar chat</button>
            </form>
        </div>
    </div>

    <!-- Archivos JavaScript Modulares -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
