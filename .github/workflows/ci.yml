name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: miServidor/package-lock.json
      - name: Instalar dependencias
        working-directory: miServidor
        run: npm ci
      - name: Pruebas
        working-directory: miServidor
        run: npm test
